name: Agregar un lugar
description: Sumá una universidad, un instituto o un programa de maestría o doctorado. Alguien del equipo lo revisa y lo publica.
title: "[Lugar] "
labels: ["nuevo-lugar"]
body:
  - type: markdown
    attributes:
      value: |
        Completá lo que sepas y dejá el resto vacío. Las fechas exactas cambian cada año, así que el cierre *habitual* suele ser lo más útil.
        Para empresas y trabajos fuera de la academia, usá el formulario **Agregar una empresa o puesto**.
  - type: dropdown
    id: section
    attributes:
      label: Sección
      options:
        - "Bajas Temperaturas"
        - "Campos"
        - "Física Médica"
        - Interdisciplinaria
        - Materia blanda
        - Materia condensada
        - Partículas
        - "Semiconductores"
        - General (todas las áreas)
        - Otra área (escribila abajo)
    validations:
      required: true
  - type: input
    id: other-area
    attributes:
      label: Si elegiste "Otra área", ¿cuál?
  - type: input
    id: name
    attributes:
      label: Institución y programa o grupo
      placeholder: "p. ej. Universidad de Ejemplópolis — Escuela de Posgrado en Materiales Cuánticos"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: País y ciudad
  - type: dropdown
    id: type
    attributes:
      label: Tipo de posición
      multiple: true
      options:
        - Doctorado
        - Maestría
        - Posdoc
        - Pasantía
        - Escuela de verano
        - Otro
  - type: input
    id: topics
    attributes:
      label: Temas
  - type: input
    id: typical-deadline
    attributes:
      label: Cierre habitual
      placeholder: "p. ej. todos los años, a principios de diciembre"
  - type: input
    id: next-deadline
    attributes:
      label: Próximo cierre conocido
      placeholder: "p. ej. 1 de diciembre de 2026"
  - type: input
    id: start
    attributes:
      label: Inicio
      placeholder: "p. ej. octubre del año siguiente / flexible"
  - type: input
    id: funding
    attributes:
      label: Financiamiento
      placeholder: "p. ej. contrato de 4 años con sueldo / necesitás una beca propia"
  - type: textarea
    id: requirements
    attributes:
      label: Requisitos
      description: Certificados de idioma, cartas de recomendación, GRE, ...
  - type: input
    id: link
    attributes:
      label: Link a la página oficial
  - type: textarea
    id: notes
    attributes:
      label: Notas
      description: Consejos, cómo es la selección, lo que quieras agregar.
  - type: input
    id: author
    attributes:
      label: Tu nombre o usuario de GitHub (opcional)
